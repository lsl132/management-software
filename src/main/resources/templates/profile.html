<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('个人信息')}"></head>
<body>

<header th:replace="~{fragments/layout :: header('profile')}"></header>

<main class="app-main">

    <section class="panel panel--narrow">
        <h1 class="panel__title">个人信息</h1>
        <p class="panel__desc">
            显示名、手机号、电子邮箱可以自行维护；登录账号、角色与账号状态由管理员统一管理。
        </p>

        <form id="profileForm" autocomplete="off" novalidate>
            <div class="form-error" id="profileError"></div>

            <h2 class="form-section">账号信息</h2>
            <div class="form-grid">
                <div class="field">
                    <span class="field__label">登录账号</span>
                    <span class="field__static" id="identifier">加载中…</span>
                </div>
                <div class="field">
                    <span class="field__label">角色</span>
                    <span class="field__static" id="roleName">加载中…</span>
                </div>
                <div class="field">
                    <span class="field__label">账号状态</span>
                    <span class="field__static" id="statusText">加载中…</span>
                </div>
                <div class="field">
                    <span class="field__label">创建时间</span>
                    <span class="field__static" id="createTime">加载中…</span>
                </div>
                <div class="field form-grid__item--full">
                    <span class="field__label">最近登录</span>
                    <span class="field__static" id="lastLogin">加载中…</span>
                </div>
            </div>

            <h2 class="form-section">我维护的信息</h2>
            <div class="form-grid">
                <label class="field" for="username">
                    <span class="field__label field__label--required">显示名</span>
                    <input class="field__input" type="text" id="username" maxlength="64"/>
                    <span class="field__hint">顶栏头像旁显示的名字，可以填中文姓名；不影响登录账号</span>
                </label>
                <label class="field" for="mobile">
                    <span class="field__label">手机号</span>
                    <input class="field__input" type="text" id="mobile" maxlength="32"/>
                </label>
                <label class="field form-grid__item--full" for="email">
                    <span class="field__label">电子邮箱</span>
                    <input class="field__input" type="email" id="email" maxlength="128"/>
                </label>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn--primary" id="btnSave">保存</button>
                <button type="button" class="btn" id="btnReset">还原</button>
            </div>
        </form>
    </section>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/profile.js}"></script>

</body>
</html>
