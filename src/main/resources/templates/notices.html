<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('公司公告')}"></head>
<body>

<header th:replace="~{fragments/layout :: header('notices')}"></header>

<main class="app-main">

    <section class="panel">
        <h1 class="panel__title">公司公告</h1>
        <p class="panel__desc">
            这里只展示已发布的公告，按发布时间倒序。点标题看全文；公告的维护在「系统设置 → 公告管理」。
        </p>

        <div class="toolbar">
            <input class="field__input" id="keyword" type="text" style="width: 260px"
                   placeholder="公告标题" autocomplete="off"/>
            <button type="button" class="btn btn--primary" id="btnSearch">查询</button>
            <button type="button" class="btn" id="btnReset">重置</button>
        </div>

        <div class="table-wrap">
            <table class="table">
                <thead>
                <tr>
                    <th>标题</th>
                    <th>发布人</th>
                    <th>发布时间</th>
                    <th>附件</th>
                </tr>
                </thead>
                <tbody id="noticeBody">
                <tr>
                    <td colspan="4" class="table__empty">正在加载…</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="pager">
            <span id="pagerInfo">共 0 条</span>
            <div class="pager__actions">
                <label>每页
                    <select class="field__select" id="pageSize" style="height: 32px">
                        <option value="10">10</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                    </select>
                </label>
                <button type="button" class="btn btn--sm" id="btnPrev">上一页</button>
                <span id="pageNow">1 / 1</span>
                <button type="button" class="btn btn--sm" id="btnNext">下一页</button>
            </div>
        </div>
    </section>

</main>

<!-- 公告详情（只读）：正文是富文本，渲染前按白名单清洗 -->
<div class="modal" id="noticeDetailModal" hidden>
    <div class="modal__mask" data-close="1"></div>
    <div class="modal__panel modal__panel--wide">
        <div class="modal__header">
            <h2 class="modal__title" id="noticeDetailTitle">公告详情</h2>
            <button type="button" class="modal__close" data-close="1">×</button>
        </div>
        <div class="modal__body">
            <div class="ann-detail__meta" id="noticeDetailMeta"></div>
            <div class="ann-detail__label">正文</div>
            <div class="ann-detail__content" id="noticeDetailContent"></div>
            <div class="ann-detail__label ann-detail__label--attachment">附件</div>
            <div class="ann-detail__attachment" id="noticeDetailAttachment"></div>
        </div>
        <div class="modal__footer">
            <button type="button" class="btn btn--primary" data-close="1">关闭</button>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/vendor/dompurify/purify.min.js}"></script>
<script th:src="@{/js/notices.js}"></script>

</body>
</html>
