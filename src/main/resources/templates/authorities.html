<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('权限管理')}"></head>
<body>

<header th:replace="~{fragments/layout :: header('authorities')}"></header>

<main class="app-main">

    <section class="panel">
        <h1 class="panel__title">权限管理</h1>
        <p class="panel__desc">
            权限为两级结构：<strong>模块分组</strong>（助记符是整万位，如 10000）下挂<strong>功能页</strong>
            （助记符在自己的万位区间内递增，如 10001）。角色授权按助记符引用权限，
            因此修改助记符会自动同步已授权的角色；已被角色引用、或分组下仍有功能页的权限不允许删除。
        </p>

        <div class="toolbar">
            <input class="field__input" id="keyword" type="text" style="width: 240px"
                   placeholder="权限名称或助记符" autocomplete="off"/>
            <button type="button" class="btn btn--primary" id="btnSearch">查询</button>
            <button type="button" class="btn" id="btnReset">重置</button>
            <span class="toolbar__spacer"></span>
            <button type="button" class="btn btn--primary" id="btnCreate">新增权限</button>
        </div>

        <div class="table-wrap">
            <table class="table">
                <thead>
                <tr>
                    <th>权限名称</th>
                    <th>助记符</th>
                    <th>类型</th>
                    <th>说明</th>
                    <th>子功能页</th>
                    <th>授权角色</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody id="authorityBody">
                <tr>
                    <td colspan="7" class="table__empty">正在加载…</td>
                </tr>
                </tbody>
            </table>
        </div>

        <p class="panel__desc panel__desc--muted" id="listSummary"></p>
    </section>

</main>

<!-- 权限表单弹窗 -->
<div class="modal" id="authorityModal" hidden>
    <div class="modal__mask" data-close="1"></div>
    <div class="modal__panel">
        <div class="modal__header">
            <h2 class="modal__title" id="authorityModalTitle">新增权限</h2>
            <button type="button" class="modal__close" data-close="1">×</button>
        </div>
        <form id="authorityForm" autocomplete="off" novalidate>
            <div class="modal__body">
                <div class="form-error" id="authorityError"></div>
                <div class="form-grid">
                    <label class="field" for="type">
                        <span class="field__label field__label--required">权限类型</span>
                        <select class="field__select" id="type">
                            <option th:each="item : ${authorityTypes}" th:value="${item.value}"
                                    th:text="${item.label}"></option>
                        </select>
                    </label>
                    <label class="field" for="groupPick" id="groupPickField" hidden>
                        <span class="field__label field__label--required">所属模块分组</span>
                        <select class="field__select" id="groupPick"></select>
                    </label>
                    <label class="field" for="mnemonic">
                        <span class="field__label field__label--required">权限助记符
                            <span class="field__hint" id="mnemonicHint">整万位，如 60000</span>
                        </span>
                        <input class="field__input" type="number" id="mnemonic" min="1" max="99999999"/>
                    </label>
                    <label class="field" for="authName">
                        <span class="field__label field__label--required">权限名称</span>
                        <input class="field__input" type="text" id="authName" maxlength="64"/>
                    </label>
                    <label class="field form-grid__item--full" for="description">
                        <span class="field__label">说明</span>
                        <textarea class="field__input" id="description" maxlength="255" rows="2"></textarea>
                    </label>
                </div>
            </div>
            <div class="modal__footer">
                <button type="button" class="btn" data-close="1">取消</button>
                <button type="submit" class="btn btn--primary" id="btnSubmitAuthority">保存</button>
            </div>
        </form>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/authorities.js}"></script>

</body>
</html>
