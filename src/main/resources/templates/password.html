<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('修改密码')}"></head>
<body>

<header th:replace="~{fragments/layout :: header('password')}"></header>

<main class="app-main">

    <section class="panel panel--narrow">
        <h1 class="panel__title">修改密码</h1>
        <p class="panel__desc">
            密码在前端用国密 SM2 加密后传输，全程不出现明文。修改成功后当前登录状态会立即失效，
            需要用新密码重新登录。
        </p>

        <form id="passwordForm" autocomplete="off" novalidate>
            <div class="form-error" id="passwordError"></div>

            <div class="form-grid">
                <label class="field form-grid__item--full" for="oldPassword">
                    <span class="field__label field__label--required">原密码</span>
                    <input class="field__input" type="password" id="oldPassword"
                           maxlength="64" autocomplete="current-password"/>
                </label>
                <label class="field" for="newPassword">
                    <span class="field__label field__label--required">新密码</span>
                    <input class="field__input" type="password" id="newPassword"
                           maxlength="32" autocomplete="new-password"/>
                    <span class="field__hint">8~32 位，需同时包含字母与数字，且不能与原密码相同</span>
                </label>
                <label class="field" for="confirmPassword">
                    <span class="field__label field__label--required">确认新密码</span>
                    <input class="field__input" type="password" id="confirmPassword"
                           maxlength="32" autocomplete="new-password"/>
                </label>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn--primary" id="btnSubmit">确认修改</button>
                <a class="btn" th:href="@{/profile}">返回个人信息</a>
            </div>
        </form>
    </section>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<!-- 登录页用同一份 sm2 实现：密码加密必须与服务端解密严格对应，不能各引一份 -->
<script th:src="@{/js/sm2.js}"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/password.js}"></script>

</body>
</html>
